name: CI/CD Pipeline - Deploy ShipGuard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Tests
        run: |
          cd backend
          export PYTHONPATH=.
          export TESTING=1
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.VPS_APP_DIR || '/root/fresa-shipguard' }}"
            echo "🚀 Deploying ShipGuard to $TARGET_DIR..."

            # Create directory or clone if not present
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Repository not found in $TARGET_DIR. Cloning repository..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # Pull latest changes from main
            git fetch --all
            git reset --hard origin/main

            # Create default .env if it does not exist
            if [ ! -f .env ]; then
              touch .env
            fi

            # Rebuild and restart container
            docker compose down --remove-orphans || true
            docker compose build --pull
            docker compose up -d

            # Clean up old dangling images
            docker image prune -f

            # Healthcheck verification
            echo "🩺 Verifying application health..."
            sleep 8
            curl -f http://127.0.0.1:8000/health || (echo "❌ Healthcheck failed! Check docker logs." && docker compose logs --tail=50 && exit 1)
            echo "✅ Deployment completed successfully!"

